morning_run:
  title: Morning run
  activity_type: run
  started_at: <%= (Time.current.beginning_of_week + 1.day).to_fs(:db) %>
  distance_km: 5.0
  duration_minutes: 30
  notes: Easy pace

long_walk:
  title: Long walk
  activity_type: walk
  started_at: <%= (Time.current.beginning_of_week - 3.days).to_fs(:db) %>
  distance_km: 20.0
  duration_minutes: 60
  notes: Hills
